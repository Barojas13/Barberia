services:
  - type: web
    name: gemelli-studio-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ConnectionStrings__DefaultConnection
        sync: false
      - key: Jwt__Issuer
        value: Gemelli.Studio.Api
      - key: Jwt__Audience
        value: Gemelli.Studio.Web
      - key: Jwt__Key
        generateValue: true
      - key: Jwt__ExpirationMinutes
        value: "120"
      - key: SeedOnStartup
        value: "true"
      - key: Cors__AllowedOrigins__0
        sync: false

  - type: web
    name: gemelli-studio-web
    runtime: static
    plan: free
    buildCommand: cd frontend/barberia-web && npm ci && node scripts/set-api-url.mjs && npm run build -- --configuration=production
    staticPublishPath: frontend/barberia-web/dist/barberia-web/browser
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: API_URL
        sync: false
